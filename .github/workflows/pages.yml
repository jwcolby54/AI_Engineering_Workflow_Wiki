name: Publish MkDocs site

on:
  push:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs

      - name: Prepare MkDocs source
        shell: bash
        run: |
          mkdir docs
          cp README.md docs/start.md
          cp index.md session_starter_template.md LICENSE docs/
          cp -R concepts examples governance raw WorkflowRecords docs/
          cp -R templates docs/workflow-templates
          find docs -type f -name "*.md" -print0 | xargs -0 sed -i 's#templates/#workflow-templates/#g'

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
